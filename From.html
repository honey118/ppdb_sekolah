<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Sekolah</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
            overflow:auto;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            position:relative;
        }

        body::before,
        body::after{
            content:'';
            position:absolute;
            border-radius:50%;
            filter:blur(100px);
            opacity:0.7;
        }

        body::before{
            width:350px;
            height:350px;
            background:#60a5fa;
            top:-100px;
            left:-100px;
        }

        body::after{
            width:300px;
            height:300px;
            background:#93c5fd;
            bottom:-80px;
            right:-80px;
        }

        .container{
            width:100%;
            max-width:550px;
            padding:40px;
            border-radius:25px;

            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.2);

            box-shadow:0 8px 32px rgba(0,0,0,0.25);

            color:white;
            position:relative;
            z-index:1;
        }

        h2{
            text-align:center;
            font-size:30px;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#dbeafe;
            margin-bottom:30px;
            font-size:14px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            font-weight:600;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;

            background:rgba(255,255,255,0.15);
            color:white;
            font-size:14px;

            border:1px solid rgba(255,255,255,0.2);

            transition:0.3s;
        }

        input::placeholder,
        textarea::placeholder{
            color:#dbeafe;
        }

        input:focus,
        select:focus,
        textarea:focus{
            background:rgba(255,255,255,0.2);
            border:1px solid #93c5fd;
            box-shadow:0 0 15px rgba(147,197,253,0.5);
        }

        select option{
            color:black;
        }

        .btn-submit{
            width:100%;
            padding:15px;
            border:none;
            border-radius:14px;
            cursor:pointer;

            background:linear-gradient(135deg,#3b82f6,#60a5fa);
            color:white;

            font-size:16px;
            font-weight:bold;

            transition:0.3s;
            margin-top:10px;
        }

        .btn-submit:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(96,165,250,0.5);
        }

    </style>
</head>
<body>

    <div class="container">

        <h2>Pendaftaran Siswa Baru</h2>
        <p>Silakan isi data diri dengan lengkap</p>
        <form>

            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label>Tempat Lahir</label>
                <input type="text" placeholder="Masukkan tempat lahir">
            </div>

            <div class="form-group">
                <label>Tanggal Lahir</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <select>
                    <option>Laki-laki</option>
                    <option>Perempuan</option>
                </select>
            </div>

            <div class="form-group">
                <label>Agama</label>
                <select>
                    <option>Islam</option>
                    <option>Kristen</option>
                    <option>Katolik</option>
                    <option>Hindu</option>
                    <option>Buddha</option>
                    <option>Konghucu</option>
                </select>
            </div>

            <div class="form-group">
                <label>NISN</label>
                <input type="text" placeholder="Masukkan NISN">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="contoh@gmail.com">
            </div>

            <div class="form-group">
                <label>Nomor HP</label>
                <input type="tel" placeholder="080000">
            </div>

            <div class="form-group">
                <label>Alamat Lengkap</label>
                <textarea rows="3" placeholder="Masukkan alamat lengkap"></textarea>
            </div>

            <div class="form-group">
                <label>Nama Ayah</label>
                <input type="text" placeholder="Masukkan nama ayah">
            </div>

            <div class="form-group">
                <label>Nama Ibu</label>
                <input type="text" placeholder="Masukkan nama ibu">
            </div>

            <div class="form-group">
                <label>Asal Sekolah</label>
                <input type="text" placeholder="Masukkan sekolah asal">
            </div>

            <div class="form-group">
                <label>Pilih Jurusan</label>
                <select>
                    <option>Rekayasa Perangkat Lunak</option>
                    <option>Teknik Komputer Jaringan</option>
                    <option>Teknik Audio Vidio</option>
                    <option>Teknik Pemesinan</option>
                    <option>Teknik Sepeda Motor</option>
                    <option>Teknik Kendaran Ringan</option>
                    <option>Teknik Instalasi Tenaga Listik</option>
                    <option>Desain Pemodelan Dan informasi Bangunan</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">
                Daftar Sekarang
            </button>

        </form>

    </div>

</body>
</html>
